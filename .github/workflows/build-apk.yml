name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Reparar cabeçalhos dos ficheiros XML
        run: |
          python3 -c '
          import glob, re
          for f in glob.glob("app/src/main/res/layout/*.xml"):
              txt = open(f, encoding="utf-8-sig").read()
              txt = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", txt)
              lines = txt.splitlines()
              if len(lines) > 1 and not lines.strip().startswith("<"):
                  header = """<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://android.com" """
                  txt = header + "\n" + "\n".join(lines[1:])
              open(f, "w", encoding="utf-8").write(txt.strip() + "\n")
          '

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Aceitar licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de Debug
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
